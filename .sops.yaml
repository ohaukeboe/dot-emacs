keys:
    # Shared host key. The same private key is installed on every machine, so
    # adding a machine never means adding a recipient here. The private material
    # is committed as sops/bootstrap/host-key.yaml; `just bootstrap-host-key`
    # decrypts it with the YubiKey and installs it locally.
    - &host age16fr85m3cp4g92mpyrzl6p3lldqzqlfc5nnkxn9tv6qaszjhrj3dqusgece

    # FIDO keys — the root of trust. Required to provision a new machine and to
    # recover if the shared host key ever has to be rotated.
    - &wallet_key age1yubikey1qwqkymath4fcdgfyx5vdy7z7z7n70xr7gekvtld9tfflzjgnk27ljm838l9

creation_rules:
    # Everything under sops/, including the bootstrap file holding the shared
    # host key itself. Listing *host as a recipient of its own key file is an
    # information no-op (whoever can read it already holds the key) and lets an
    # already-provisioned machine re-run `sops updatekeys` without the YubiKey.
    - path_regex: sops/(home|bootstrap)/[^/]+\.(yaml|json|env|ini)$
      key_groups:
          - age:
                - *wallet_key
                - *host
