# Recipients for this project's encrypted secrets.
#
# The key named here is scoped to projects, deliberately distinct from the
# shared host key that provisions machines: a project repo should never carry
# the key that unlocks your infrastructure.  See docs/adr/0002 in the
# workstation config for why.
#
# `nix-init` substitutes the recipient from `nix-init-sops-recipient'.  If it
# wrote a placeholder below, set that variable and replace this by hand.
creation_rules:
  - path_regex: secrets\.enc\.yaml$
    age: "@AGE_RECIPIENT@"
