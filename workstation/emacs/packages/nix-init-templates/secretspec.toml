# Declarative secret *names*; values never appear here.
#
# The sops provider keeps them in secrets.enc.yaml, encrypted to the recipient
# in .sops.yaml, so the file is safe to commit and survives a fresh clone.
# Layout inside that file is [project][profile][key].
#
# Populate with `just -f secrets.justfile check`, which prompts for anything
# missing and writes it back encrypted.

[project]
name = "@PROJECT@"
revision = "1.0"
# require_reason is left at its default ("agents"), so a coding agent must
# give a reason before it can read these. Note how far that reaches with the
# devenv kind: devenv resolves secrets at evaluation time, so for an agent the
# gate blocks entering the shell at all, not just reading a secret -- direnv
# fails on cd. Satisfy it with SECRETSPEC_REASON in the agent's environment,
# or set this to false if the audit trail is not worth it here.

[providers]
sops = "sops://secrets.enc.yaml"

# Declare secrets below, one per line. Nothing above this line belongs here.
[profiles.default]
# A profile must declare at least one secret or the manifest is invalid --
# devenv refuses to evaluate at all, which breaks direnv on entering the
# directory. Replace this with a real one; required = false keeps it inert
# until you do.
EXAMPLE = { description = "Replace with a real secret name", required = false }

# Binds every secret above to the sops provider. Naming an alias under
# [providers] does not bind it; without this, secretspec falls through to
# ~/.config/secretspec/config.toml and fails with "No provider backend
# configured". (0.21 adds a project-wide [defaults]; 0.20 in nixpkgs does not.)
[profiles.default.defaults]
providers = ["sops"]
